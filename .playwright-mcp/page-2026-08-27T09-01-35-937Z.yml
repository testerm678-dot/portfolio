          - paragraph [ref=f2e145]:
            - text: Playwright (Python) and Selenium WebDriver suites built on the
            - strong [ref=f2e146]: Page Object Model
            - text: — maintainable, reusable and wired for regression runs on every release.
          - list [ref=f2e147]:
            - listitem [ref=f2e148]: Framework design
            - listitem [ref=f2e149]: Regression suite maintenance
            - listitem [ref=f2e150]: UI Automator for Android
        - article [ref=f2e151]:
          - heading "API Testing" [level=3] [ref=f2e156]
          - paragraph [ref=f2e157]:
            - text: REST API validation with Postman collections, reusable environments and request chaining — executed headless via
            - strong [ref=f2e158]: Newman
            - text: in CLI with HTML reports for the team.
          - list [ref=f2e159]:
            - listitem [ref=f2e160]: Schema & response validation
