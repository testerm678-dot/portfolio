        - article [ref=f2e163]:
          - heading "Performance Testing" [level=3] [ref=f2e167]
          - paragraph [ref=f2e168]: Load and stress scenarios in Apache JMeter and BlazeMeter, analysing response time, throughput and error rate under concurrent user load before the traffic is real.
          - list [ref=f2e169]:
            - listitem [ref=f2e170]: Load & stress profiles
            - listitem [ref=f2e171]: Bottleneck analysis
