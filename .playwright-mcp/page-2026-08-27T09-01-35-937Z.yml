        - heading "Quality is not a phase. It's how I think." [level=2] [ref=f2e86]
      - generic [ref=f2e87]:
        - generic [ref=f2e88]:
          - img "Portrait of Tuhin Hossain, Software QA Engineer" [ref=f2e90]
