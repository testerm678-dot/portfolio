        - generic [ref=f2e557]: 06 — How I work
        - heading "My QA process, end to end" [level=2] [ref=f2e558]
        - paragraph [ref=f2e559]: The same loop whether it's a two-week MVP sprint or an enterprise ERP release.
      - list [ref=f2e560]:
        - listitem [ref=f2e561]:
          - generic [ref=f2e562]: "01"
          - heading "Requirement Analysis" [level=3] [ref=f2e563]
          - paragraph [ref=f2e564]:
            - text: Read the spec like an adversary. Ambiguities, missing acceptance criteria and edge cases get raised
            - emphasis [ref=f2e565]: before
            - text: a line of code is written.
        - listitem [ref=f2e566]:
          - generic [ref=f2e567]: "02"
          - heading "Test Planning & Strategy" [level=3] [ref=f2e568]
          - paragraph [ref=f2e569]: Scope, entry/exit criteria, environments, risk-based priorities and the requirement traceability matrix — so coverage is provable, not assumed.
        - listitem [ref=f2e570]:
          - generic [ref=f2e571]: "03"
          - heading "Test Design" [level=3] [ref=f2e572]
          - paragraph [ref=f2e573]: "Scenarios and cases using black-box techniques: equivalence partitioning, boundary values, decision tables, state transition and error guessing."
        - listitem [ref=f2e574]:
          - generic [ref=f2e575]: "04"
          - heading "Execution & Automation" [level=3] [ref=f2e576]
          - paragraph [ref=f2e577]: Manual passes for new behaviour, automated Playwright/Selenium suites for regression, Postman/Newman for the API layer, JMeter for load.
        - listitem [ref=f2e578]:
          - generic [ref=f2e579]: "05"
          - heading "Defect Management" [level=3] [ref=f2e580]
          - paragraph [ref=f2e581]: Clear reproduction steps, severity and priority, evidence attached, tracked in Jira through the full defect life cycle until verified closed.
        - listitem [ref=f2e582]:
          - generic [ref=f2e583]: "06"
          - heading "Reporting & Sign-off" [level=3] [ref=f2e584]
          - paragraph [ref=f2e585]: Test summary reports, coverage and defect metrics, and an honest go/no-go recommendation stakeholders can actually act on.
