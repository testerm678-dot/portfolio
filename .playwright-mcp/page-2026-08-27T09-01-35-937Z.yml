        - generic [ref=f2e126]: 02 — Expertise
        - heading "What I bring to your release train" [level=2] [ref=f2e127]
        - paragraph [ref=f2e128]: Seven capabilities I use daily to keep products shippable — and keep regressions out of production.
      - generic [ref=f2e129]:
        - article [ref=f2e130]:
          - heading "Manual & Functional Testing" [level=3] [ref=f2e134]
          - paragraph [ref=f2e135]: Functional, regression, smoke, sanity, retesting, integration, system, exploratory, ad-hoc, compatibility and UAT — designed with equivalence partitioning, BVA, decision tables and state transition.
          - list [ref=f2e136]:
            - listitem [ref=f2e137]: Test plans & RTM
            - listitem [ref=f2e138]: Test case design & review
            - listitem [ref=f2e139]: Test summary reports
        - article [ref=f2e140]:
