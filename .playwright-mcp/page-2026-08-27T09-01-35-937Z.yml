        - generic [ref=f2e95]:
          - paragraph [ref=f2e96]:
            - text: I'm a
            - strong [ref=f2e97]: Software QA Engineer
            - text: with four years spent ensuring that products used by real people every day behave exactly as specified. I work end-to-end across the
            - strong [ref=f2e98]: SDLC and STLC
            - text: — requirement analysis, test strategy, test case design, execution, defect life-cycle management and release sign-off — and I'm as ready to challenge an ambiguous acceptance criterion as I am to sign off a release candidate.
          - paragraph [ref=f2e99]:
            - text: I currently
            - strong [ref=f2e100]: own quality end-to-end
            - text: "for a three-product portfolio: a live pharmacy management platform across web, Android and iOS; a SaaS eCommerce website builder; and a RAG-based AI chatbot. Covering three platforms at once demands a risk-based strategy — judging what earns automation, what needs a manual pass, and what is genuinely ready to ship. Earlier I established the test foundations for enterprise"
            - strong [ref=f2e101]: Payroll and ERP
            - text: systems, where a rounding error is somebody's salary.
          - paragraph [ref=f2e102]:
            - text: I automate what earns it (Playwright and Selenium in Python, structured with the Page Object Model), verify what the interface conceals (Postman and Newman across the API layer, MySQL against the data), and measure what fails under pressure (JMeter, BlazeMeter). I also carry the delivery side, having served as
            - strong [ref=f2e103]: Scrum Master / Associate Project Manager
            - text: through sprint planning, ceremonies and release coordination.
